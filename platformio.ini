; PlatformIO Project Configuration File
; Projeto E.L.O.S. - Caixa Inteligente & Pulseira

; =========================================
; AMBIENTE 1: A CAIXA (ESP32 DevKit Padrão)
; =========================================
[env:caixa]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<Caixa/>
lib_deps =
    arduino-libraries/Stepper@^1.1.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    miguelbalboa/MFRC522@^1.4.11

; =========================================
; AMBIENTE 2: DIAGNÓSTICO E SCANNER DE PORTAS (I2C + RFID)
; =========================================
[env:scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
board_build.partitions = huge_app.csv
build_src_filter = +<Scanner/>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    miguelbalboa/MFRC522@^1.4.11

; =========================================
; AMBIENTE 3: A PULSEIRA (XIAO ESP32-C3)
; =========================================
[env:pulseira]
platform = espressif32
board = seeed_xiao_esp32c3 
framework = arduino
monitor_speed = 115200
build_src_filter = +<Pulseira/>
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
