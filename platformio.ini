; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; AMBIENTE 1: A CAIXA (ESP32 Padrão)
; AMBIENTE 1: A CAIXA (ESP32 Padrão)
[env:caixa]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Lê a pasta src, mas ignora o código da Pulseira
build_src_filter = +<*> -<Pulseira/> 
lib_deps =
    arduino-libraries/Stepper@^1.1.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9

; =========================================

; AMBIENTE 2: A PULSEIRA (XIAO ESP32)
[env:pulseira]
platform = espressif32
board = seeed_xiao_esp32c3 
framework = arduino
monitor_speed = 115200
; Lê a pasta src, mas ignora o código da Caixa
build_src_filter = +<*> -<Caixa/> 
; Ativa o USB Nativo do XIAO para o Monitor Serial funcionar
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =