<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>E.L.O.S. App Bluetooth</title>

  <!-- Inicialização imediata do tema (evita flash branco no modo escuro) -->
  <script>
    (function () {
      var t = localStorage.getItem('elos-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Estilos Modulares (Design System E.L.O.S.) -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Runtime Nativo Capacitor & Plugin Bluetooth Low Energy -->
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/ble-plugin.js"></script>
</head>
<body>
  <header>
    <h1>
      <span id="conn" class="dot" title="Status Bluetooth"></span>
      E.L.O.S. Bluetooth
    </h1>
    <div class="header-actions">
      <button class="bt-btn" id="btBtn" onclick="ElosBluetooth.toggleConnection()">
        🔵 Conectar Caixa
      </button>
      <button class="icon-btn" id="themeBtn" onclick="ElosUI.toggleTheme()" aria-label="Alternar tema">
        🌙
      </button>
    </div>
  </header>

  <main>
    <!-- PRÓXIMA DOSE -->
    <section class="card hero full">
      <div class="muted">Próxima dose em</div>
      <div class="countdown" id="proxTempo">--:--:--</div>
      <div class="muted" id="proxDesc">Conecte via Bluetooth para sincronizar</div>
    </section>

    <!-- ESTOQUE -->
    <section class="card">
      <h2>📦 Estoque</h2>
      <div class="stock-num"><span id="eOcup">-</span> / <span id="eTotal">-</span></div>
      <div class="bar"><div id="eBar"></div></div>
      <div class="muted" style="text-align:center">Ocupados / Capacidade total</div>

      <div class="row">
        <div>
          <label for="inp_total">Capacidade</label>
          <input type="number" id="inp_total" min="1" value="7" inputmode="numeric">
        </div>
        <div>
          <label for="inp_ocupados">Abastecidos</label>
          <input type="number" id="inp_ocupados" min="0" placeholder="Ex: 7" inputmode="numeric">
        </div>
      </div>
      <button class="btn warn" onclick="ElosApp.updateStock()">🔄 Atualizar estoque</button>
      <button class="btn" id="btnDispense" onclick="ElosApp.dispenseNow()">💊 Dispensar uma dose agora</button>
    </section>

    <!-- AGENDAR -->
    <section class="card">
      <h2>⏰ Agendar nova dose</h2>
      <label for="modo">Tipo de agendamento</label>
      <select id="modo" onchange="ElosUI.switchScheduleMode()">
        <option value="horario">Horário exato (ex: 18:15)</option>
        <option value="cronometro">Cronômetro (daqui a X tempo)</option>
        <option value="intervalo">Intervalo (a cada X horas)</option>
      </select>

      <div id="div_horario">
        <label for="h_time">Hora</label>
        <input type="time" id="h_time">
        <label class="check">
          <input type="checkbox" id="h_diario"> Repetir todos os dias
        </label>
      </div>

      <div id="div_cronometro" class="hidden">
        <div class="row">
          <div>
            <label for="c_horas">Horas</label>
            <input type="number" id="c_horas" min="0" max="99" placeholder="0" inputmode="numeric">
          </div>
          <div>
            <label for="c_mins">Minutos</label>
            <input type="number" id="c_mins" min="0" max="59" placeholder="0" inputmode="numeric">
          </div>
        </div>
      </div>

      <div id="div_intervalo" class="hidden">
        <label for="i_horas">Repetir a cada (horas)</label>
        <input type="number" id="i_horas" min="1" max="99" placeholder="Ex: 8" inputmode="numeric">
      </div>

      <button class="btn ok" onclick="ElosApp.saveSchedule()">➕ Adicionar à lista</button>
    </section>

    <!-- LISTA DE AGENDAMENTOS -->
    <section class="card full">
      <h2>📋 Agendamentos ativos</h2>
      <ul id="lista">
        <li class="empty">Desconectado</li>
      </ul>
      <button class="btn danger" id="btnLimpar" onclick="ElosApp.clearSchedules()">🗑️ Limpar todos</button>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <!-- Arquitetura Modular da Aplicação -->
  <script src="js/ui.js"></script>
  <script src="js/bluetooth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
