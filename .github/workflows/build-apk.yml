name: Gerar APK Bluetooth ELOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias Capacitor e Sincronizar Android
        working-directory: ./app_mobile
        run: |
          npm install
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: ./app_mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copiar APK para a pasta app_mobile
        run: |
          cp app_mobile/android/app/build/outputs/apk/debug/app-debug.apk app_mobile/ELOS_Caixa.apk

      - name: Publicar APK nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ELOS_Caixa_APK
          path: app_mobile/ELOS_Caixa.apk

      - name: Salvar ELOS_Caixa.apk no repositorio para baixar com git pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git pull --rebase origin main
          cp app_mobile/android/app/build/outputs/apk/debug/app-debug.apk app_mobile/ELOS_Caixa.apk
          git add -f app_mobile/ELOS_Caixa.apk
          git diff --staged --quiet || (git commit -m "chore: Atualiza ELOS_Caixa.apk compilado [skip ci]" && git push origin HEAD:main)
